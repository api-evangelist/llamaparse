openapi: 3.0.3
info:
  title: Llama Platform Agent Data Parsing API
  version: 0.1.0
tags:
- name: Parsing
paths:
  /api/v1/parsing/job/{job_id}/result/image/{name}:
    get:
      tags:
      - Parsing
      summary: Get Job Image Result
      description: Get a job by id
      operationId: get_job_image_result_api_v1_parsing_job__job_id__result_image__name__get
      security:
      - HTTPBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      - name: project_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Project Id
      - name: organization_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Organization Id
      - name: session
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Session
      responses:
        '200':
          description: Successful Response
          content:
            image/jpeg: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
