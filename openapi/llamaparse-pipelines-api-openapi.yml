components:
  schemas:
    ChatMessage:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        index:
          type: integer
          title: Index
          description: The index of the message in the chat.
        annotations:
          items:
            $ref: '#/components/schemas/MessageAnnotation'
          type: array
          title: Annotations
          description: Retrieval annotations for the message.
        role:
          $ref: '#/components/schemas/MessageRole'
          description: The role of the message.
        content:
          anyOf:
          - type: string
          - type: 'null'
          title: Content
          description: Text content of the generation
        additional_kwargs:
          additionalProperties:
            type: string
          type: object
          title: Additional Kwargs
          description: Additional arguments passed to the model
        class_name:
          type: string
          title: Class Name
          default: base_component
      type: object
      required:
      - id
      - index
      - role
      title: ChatMessage
    CloudMilvusVectorStore:
      properties:
        supports_nested_metadata_filters:
          type: boolean
          title: Supports Nested Metadata Filters
          default: false
        uri:
          type: string
          title: Uri
        collection_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Collection Name
        token:
          anyOf:
          - type: string
            format: password
            writeOnly: true
          - type: 'null'
          title: Token
        embedding_dimension:
          anyOf:
          - type: integer
          - type: 'null'
          title: Embedding Dimension
        class_name:
          type: string
          title: Class Name
          default: CloudMilvusVectorStore
      type: object
      required:
      - uri
      title: CloudMilvusVectorStore
      description: Cloud Milvus Vector Store.
    CloudPineconeVectorStore:
      properties:
        supports_nested_metadata_filters:
          type: boolean
          const: true
          title: Supports Nested Metadata Filters
          default: true
        api_key:
          type: string
          format: password
          title: Api Key
          description: The API key for authenticating with Pinecone
          writeOnly: true
        index_name:
          type: string
          title: Index Name
        namespace:
          anyOf:
          - type: string
          - type: 'null'
          title: Namespace
        insert_kwargs:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Insert Kwargs
        class_name:
          type: string
          title: Class Name
          default: CloudPineconeVectorStore
      type: object
      required:
      - api_key
      - index_name
      title: CloudPineconeVectorStore
      description: "Cloud Pinecone Vector Store.\n\nThis class is used to store the configuration for a Pinecone vector store, so that it can be\ncreated and used in LlamaCloud.\n\nArgs:\n    api_key (str): API key for authenticating with Pinecone\n    index_name (str): name of the Pinecone index\n    namespace (optional[str]): namespace to use in the Pinecone index\n    insert_kwargs (optional[dict]): additional kwargs to pass during insertion"
    VertexAIEmbeddingConfig:
      properties:
        type:
          type: string
          const: VERTEXAI_EMBEDDING
          title: Type
          description: Type of the embedding model.
          default: VERTEXAI_EMBEDDING
        component:
          $ref: '#/components/schemas/VertexTextEmbedding'
          description: Configuration for the VertexAI embedding model.
      type: object
      title: VertexAIEmbeddingConfig
    TokenChunkingConfig:
      properties:
        chunk_size:
          type: integer
          exclusiveMinimum: 0.0
          title: Chunk Size
          default: 1024
        chunk_overlap:
          type: integer
          title: Chunk Overlap
          default: 200
          gte: 0
        mode:
          type: string
          const: token
          title: Mode
          default: token
        separator:
          type: string
          title: Separator
          default: ' '
      type: object
      title: TokenChunkingConfig
    HuggingFaceInferenceAPIEmbeddingConfig:
      properties:
        type:
          type: string
          const: HUGGINGFACE_API_EMBEDDING
          title: Type
          description: Type of the embedding model.
          default: HUGGINGFACE_API_EMBEDDING
        component:
          $ref: '#/components/schemas/HuggingFaceInferenceAPIEmbedding'
          description: Configuration for the HuggingFace Inference API embedding model.
      type: object
      title: HuggingFaceInferenceAPIEmbeddingConfig
    DataSinkCreate:
      properties:
        name:
          type: string
          title: Name
          description: The name of the data sink.
        sink_type:
          $ref: '#/components/schemas/ConfigurableDataSinkNames'
        component:
          anyOf:
          - additionalProperties: true
            type: object
          - $ref: '#/components/schemas/CloudPineconeVectorStore'
          - $ref: '#/components/schemas/CloudPostgresVectorStore'
          - $ref: '#/components/schemas/CloudQdrantVectorStore'
          - $ref: '#/components/schemas/CloudAzureAISearchVectorStore'
          - $ref: '#/components/schemas/CloudMongoDBAtlasVectorSearch'
          - $ref: '#/components/schemas/CloudMilvusVectorStore'
          - $ref: '#/components/schemas/CloudAstraDBVectorStore'
          title: DataSinkCreateComponent
          description: Component that implements the data sink
      type: object
      required:
      - name
      - sink_type
      - component
      title: DataSinkCreate
      description: Schema for creating a data sink.
    RetrievalParams:
      properties:
        dense_similarity_top_k:
          anyOf:
          - type: integer
            maximum: 100.0
            minimum: 1.0
          - type: 'null'
          title: Dense Similarity Top K
          description: Number of nodes for dense retrieval.
          default: 30
        dense_similarity_cutoff:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Dense Similarity Cutoff
          description: Minimum similarity score wrt query for retrieval
          default: 0.0
        sparse_similarity_top_k:
          anyOf:
          - type: integer
            maximum: 100.0
            minimum: 1.0
          - type: 'null'
          title: Sparse Similarity Top K
          description: Number of nodes for sparse retrieval.
          default: 30
        enable_reranking:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enable Reranking
          description: Enable reranking for retrieval
        rerank_top_n:
          anyOf:
          - type: integer
            maximum: 100.0
            minimum: 1.0
          - type: 'null'
          title: Rerank Top N
          description: Number of reranked nodes for returning.
          default: 6
        alpha:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Alpha
          description: Alpha value for hybrid retrieval to determine the weights between dense and sparse retrieval. 0 is sparse retrieval and 1 is dense retrieval.
        search_filters:
          anyOf:
          - $ref: '#/components/schemas/MetadataFilters'
          - type: 'null'
          description: Search filters for retrieval.
        search_filters_inference_schema:
          anyOf:
          - additionalProperties:
              anyOf:
              - additionalProperties: true
                type: object
              - items: {}
                type: array
              - type: string
              - type: integer
              - type: number
              - type: boolean
              - type: 'null'
            type: object
          - type: 'null'
          title: Search Filters Inference Schema
          description: JSON Schema that will be used to infer search_filters. Omit or leave as null to skip inference.
        files_top_k:
          anyOf:
          - type: integer
            maximum: 5.0
            minimum: 1.0
          - type: 'null'
          title: Files Top K
          description: Number of files to retrieve (only for retrieval mode files_via_metadata and files_via_content).
          default: 1
        retrieval_mode:
          $ref: '#/components/schemas/RetrievalMode'
          description: The retrieval mode for the query.
          default: chunks
        retrieve_image_nodes:
          type: boolean
          title: Retrieve Image Nodes
          description: Whether to retrieve image nodes.
          default: false
          deprecated: true
        retrieve_page_screenshot_nodes:
          type: boolean
          title: Retrieve Page Screenshot Nodes
          description: Whether to retrieve page screenshot nodes.
          default: false
        retrieve_page_figure_nodes:
          type: boolean
          title: Retrieve Page Figure Nodes
          description: Whether to retrieve page figure nodes.
          default: false
        query:
          type: string
          minLength: 1
          title: Query
          description: The query to retrieve against.
        class_name:
          type: string
          title: Class Name
          default: base_component
      type: object
      required:
      - query
      title: RetrievalParams
      description: Schema for the search params for an retrieval execution.
    MessageAnnotation:
      properties:
        type:
          type: string
          title: Type
        data:
          type: string
          contentMediaType: application/json
          contentSchema: {}
          title: Data
        class_name:
          type: string
          title: Class Name
          default: base_component
      type: object
      required:
      - type
      - data
      title: MessageAnnotation
    CohereEmbedding:
      properties:
        model_name:
          type: string
          title: Model Name
          description: The modelId of the Cohere model to use.
          default: embed-english-v3.0
        embed_batch_size:
          type: integer
          maximum: 2048.0
          exclusiveMinimum: 0.0
          title: Embed Batch Size
          description: The batch size for embedding calls.
          default: 10
        num_workers:
          anyOf:
          - type: integer
          - type: 'null'
          title: Num Workers
          description: The number of workers to use for async embedding calls.
        api_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Api Key
          description: The Cohere API key.
        truncate:
          type: string
          title: Truncate
          description: Truncation type - START/ END/ NONE
          default: END
        input_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Input Type
          description: Model Input type. If not provided, search_document and search_query are used when needed.
        embedding_type:
          type: string
          title: Embedding Type
          description: Embedding type. If not provided float embedding_type is used when needed.
          default: float
        class_name:
          type: string
          title: Class Name
          default: CohereEmbedding
      type: object
      required:
      - api_key
      title: CohereEmbedding
    CloudDocumentCreate:
      properties:
        text:
          type: string
          title: Text
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
        excluded_embed_metadata_keys:
          items:
            type: string
          type: array
          title: Excluded Embed Metadata Keys
          default: []
        excluded_llm_metadata_keys:
          items:
            type: string
          type: array
          title: Excluded Llm Metadata Keys
          default: []
        page_positions:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Page Positions
          description: indices in the CloudDocument.text where a new page begins. e.g. Second page starts at index specified by page_positions[1].
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
      type: object
      required:
      - text
      - metadata
      title: CloudDocumentCreate
      description: Create a new cloud document.
    PageSegmentationConfig:
      properties:
        mode:
          type: string
          const: page
          title: Mode
          default: page
        page_separator:
          type: string
          title: Page Separator
          default: '

            ---

            '
      type: object
      title: PageSegmentationConfig
    ElementSegmentationConfig:
      properties:
        mode:
          type: string
          const: element
          title: Mode
          default: element
      type: object
      title: ElementSegmentationConfig
    SupportedLLMModelNames:
      type: string
      enum:
      - GPT_4O
      - GPT_4O_MINI
      - GPT_4_1
      - GPT_4_1_NANO
      - GPT_4_1_MINI
      - AZURE_OPENAI_GPT_4O
      - AZURE_OPENAI_GPT_4O_MINI
      - AZURE_OPENAI_GPT_4_1
      - AZURE_OPENAI_GPT_4_1_MINI
      - AZURE_OPENAI_GPT_4_1_NANO
      - CLAUDE_4_5_SONNET
      - BEDROCK_CLAUDE_3_5_SONNET_V1
      - BEDROCK_CLAUDE_3_5_SONNET_V2
      title: SupportedLLMModelNames
    PageFigureMetadata:
      properties:
        figure_name:
          type: string
          title: Figure Name
          description: The name of the figure
        file_id:
          type: string
          format: uuid
          title: File Id
          description: The ID of the file that the figure was taken from
        page_index:
          type: integer
          minimum: 0.0
          title: Page Index
          description: The index of the page for which the figure is taken (0-indexed)
        figure_size:
          type: integer
          minimum: 0.0
          title: Figure Size
          description: The size of the figure in bytes
        is_likely_noise:
          type: boolean
          title: Is Likely Noise
          description: Whether the figure is likely to be noise
          default: false
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          description: The confidence of the figure
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
          description: Metadata for the figure
      type: object
      required:
      - figure_name
      - file_id
      - page_index
      - figure_size
      - confidence
      title: PageFigureMetadata
    SparseModelConfig:
      properties:
        model_type:
          $ref: '#/components/schemas/SparseModelType'
          description: The sparse model type to use. 'bm25' uses Qdrant's FastEmbed BM25 model (default for new pipelines), 'splade' uses HuggingFace Splade model, 'auto' selects based on deployment mode (BYOC uses term frequency, Cloud uses Splade).
          default: bm25
        class_name:
          type: string
          title: Class Name
          default: SparseModelConfig
      type: object
      title: SparseModelConfig
      description: 'Configuration for sparse embedding models used in hybrid search.


        This allows users to choose between Splade and BM25 models for

        sparse retrieval in managed data sinks.'
    ManagedOpenAIEmbedding:
      properties:
        model_name:
          type: string
          const: openai-text-embedding-3-small
          title: Model Name
          description: The name of the OpenAI embedding model.
          default: openai-text-embedding-3-small
        embed_batch_size:
          type: integer
          maximum: 2048.0
          exclusiveMinimum: 0.0
          title: Embed Batch Size
          description: The batch size for embedding calls.
          default: 10
        num_workers:
          anyOf:
          - type: integer
          - type: 'null'
          title: Num Workers
          description: The number of workers to use for async embedding calls.
        class_name:
          type: string
          title: Class Name
          default: ManagedOpenAIEmbedding
      type: object
      title: ManagedOpenAIEmbedding
    ManagedIngestionStatusResponse:
      properties:
        job_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Job Id
          description: ID of the latest job.
        deployment_date:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Deployment Date
          description: Date of the deployment.
        status:
          $ref: '#/components/schemas/ManagedIngestionStatus'
          description: Status of the ingestion.
        error:
          anyOf:
          - items:
              $ref: '#/components/schemas/IngestionErrorResponse'
            type: array
          - type: 'null'
          title: Error
          description: List of errors that occurred during ingestion.
        effective_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Effective At
          description: When the status is effective
      type: object
      required:
      - status
      title: ManagedIngestionStatusResponse
    GeminiEmbedding:
      properties:
        model_name:
          type: string
          title: Model Name
          description: The modelId of the Gemini model to use.
          default: models/embedding-001
        embed_batch_size:
          type: integer
          maximum: 2048.0
          exclusiveMinimum: 0.0
          title: Embed Batch Size
          description: The batch size for embedding calls.
          default: 10
        num_workers:
          anyOf:
          - type: integer
          - type: 'null'
          title: Num Workers
          description: The number of workers to use for async embedding calls.
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
          description: Title is only applicable for retrieval_document tasks, and is used to represent a document title. For other tasks, title is invalid.
          default: ''
        task_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Task Type
          description: The task for embedding model.
          default: retrieval_document
        api_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Api Key
          description: API key to access the model. Defaults to None.
        api_base:
          anyOf:
          - type: string
          - type: 'null'
          title: Api Base
          description: API base to access the model. Defaults to None.
        transport:
          anyOf:
          - type: string
          - type: 'null'
          title: Transport
          description: Transport to access the model. Defaults to None.
        output_dimensionality:
          anyOf:
          - type: integer
          - type: 'null'
          title: Output Dimensionality
          description: Optional reduced dimension for output embeddings. Supported by models/text-embedding-004 and newer (e.g. gemini-embedding-001). Not supported by models/embedding-001.
        class_name:
          type: string
          title: Class Name
          default: GeminiEmbedding
      type: object
      title: GeminiEmbedding
    CloudAstraDBVectorStore:
      properties:
        supports_nested_metadata_filters:
          type: boolean
          const: true
          title: Supports Nested Metadata Filters
          default: true
        token:
          type: string
          format: password
          title: Token
          description: The Astra DB Application Token to use
          writeOnly: true
        api_endpoint:
          type: string
          title: Api Endpoint
          description: The Astra DB JSON API endpoint for your database
        collection_name:
          type: string
          title: Collection Name
          description: Collection name to use. If not existing, it will be created
        embedding_dimension:
          type: integer
          title: Embedding Dimension
          description: Length of the embedding vectors in use
        keyspace:
          anyOf:
          - type: string
          - type: 'null'
          title: Keyspace
          description: The keyspace to use. If not provided, 'default_keyspace'
        class_name:
          type: string
          title: Class Name
          default: CloudAstraDBVectorStore
      type: object
      required:
      - token
      - api_endpoint
      - collection_name
      - embedding_dimension
      title: CloudAstraDBVectorStore
      description: "Cloud AstraDB Vector Store.\n\nThis class is used to store the configuration for an AstraDB vector store, so that it can be\ncreated and used in LlamaCloud.\n\nArgs:\n    token (str): The Astra DB Application Token to use.\n    api_endpoint (str): The Astra DB JSON API endpoint for your database.\n    collection_name (str): Collection name to use. If not existing, it will be created.\n    embedding_dimension (int): Length of the embedding vectors in use.\n    keyspace (optional[str]): The keyspace to use. If not provided, 'default_keyspace'"
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    OpenAIEmbeddingConfig:
      properties:
        type:
          type: string
          const: OPENAI_EMBEDDING
          title: Type
          description: Type of the embedding model.
          default: OPENAI_EMBEDDING
        component:
          $ref: '#/components/schemas/OpenAIEmbedding'
          description: Configuration for the OpenAI embedding model.
      type: object
      title: OpenAIEmbeddingConfig
    AdvancedModeTransformConfig:
      properties:
        mode:
          type: string
          const: advanced
          title: Mode
          default: advanced
        segmentation_config:
          anyOf:
          - $ref: '#/components/schemas/NoneSegmentationConfig'
          - $ref: '#/components/schemas/PageSegmentationConfig'
          - $ref: '#/components/schemas/ElementSegmentationConfig'
          title: Segmentation Config
          description: Configuration for the segmentation.
        chunking_config:
          anyOf:
          - $ref: '#/components/schemas/NoneChunkingConfig'
          - $ref: '#/components/schemas/CharacterChunkingConfig'
          - $ref: '#/components/schemas/TokenChunkingConfig'
          - $ref: '#/components/schemas/SentenceChunkingConfig'
          - $ref: '#/components/schemas/SemanticChunkingConfig'
          title: Chunking Config
          description: Configuration for the chunking.
      type: object
      title: AdvancedModeTransformConfig
    NoneChunkingConfig:
      properties:
        mode:
          type: string
          const: none
          title: Mode
          default: none
      type: object
      title: NoneChunkingConfig
    FilterOperator:
      type: string
      enum:
      - ==
      - '>'
      - <
      - '!='
      - '>='
      - <=
      - in
      - nin
      - any
      - all
      - text_match
      - text_match_insensitive
      - contains
      - is_empty
      title: FilterOperator
      description: Vector store filter operator.
    CohereEmbeddingConfig:
      properties:
        type:
          type: string
          const: COHERE_EMBEDDING
          title: Type
          description: Type of the embedding model.
          default: COHERE_EMBEDDING
        component:
          $ref: '#/components/schemas/CohereEmbedding'
          description: Configuration for the Cohere embedding model.
      type: object
      title: CohereEmbeddingConfig
    FilterCondition:
      type: string
      enum:
      - and
      - or
      - not
      title: FilterCondition
      description: Vector store filter conditions to combine different filters.
    TextNode:
      properties:
        id_:
          type: string
          title: Id
          description: Unique ID of the node.
        embedding:
          anyOf:
          - items:
              type: number
            type: array
          - type: 'null'
          title: Embedding
          description: Embedding of the node.
        extra_info:
          additionalProperties: true
          type: object
          title: Extra Info
          description: A flat dictionary of metadata fields
        excluded_embed_metadata_keys:
          items:
            type: string
          type: array
          title: Excluded Embed Metadata Keys
          description: Metadata keys that are excluded from text for the embed model.
        excluded_llm_metadata_keys:
          items:
            type: string
          type: array
          title: Excluded Llm Metadata Keys
          description: Metadata keys that are excluded from text for the LLM.
        relationships:
