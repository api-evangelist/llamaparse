          - type: string
            format: date-time
          - type: 'null'
          title: Last Modified At
          description: The last modified time of the file
        resource_info:
          anyOf:
          - additionalProperties:
              anyOf:
              - additionalProperties: true
                type: object
              - items: {}
                type: array
              - type: string
              - type: integer
              - type: number
              - type: boolean
              - type: 'null'
            type: object
          - type: 'null'
          title: Resource Info
          description: Resource information for the file
        permission_info:
          anyOf:
          - additionalProperties:
              anyOf:
              - additionalProperties: true
                type: object
              - items: {}
                type: array
              - type: string
              - type: integer
              - type: number
              - type: boolean
              - type: 'null'
            type: object
          - type: 'null'
          title: Permission Info
          description: Permission information for the file
        data_source_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Data Source Id
          description: The ID of the data source that the file belongs to
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
          description: The expiration date for the file. Files past this date can be deleted.
        purpose:
          anyOf:
          - type: string
          - type: 'null'
          title: Purpose
          description: The intended purpose of the file (e.g., 'user_data', 'parse', 'extract', 'split', 'classify')
      type: object
      required:
      - id
      - name
      - project_id
      title: File
      description: Schema for a file.
    AggregateRequest:
      properties:
        page_size:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page Size
          description: The maximum number of items to return. The service may return fewer than this value. If unspecified, a default page size will be used. The maximum value is typically 1000; values above this will be coerced to the maximum.
        page_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Page Token
          description: A page token, received from a previous list call. Provide this to retrieve the subsequent page.
        filter:
          anyOf:
          - additionalProperties:
