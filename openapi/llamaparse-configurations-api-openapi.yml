    LlamaParseProcessingOptions:
      properties:
        ignore:
          $ref: '#/components/schemas/LlamaParseIgnoreOptions'
          description: Options for ignoring specific text types (diagonal, hidden, text in images)
        ocr_parameters:
          $ref: '#/components/schemas/LlamaParseOcrParameters'
          description: OCR configuration including language detection settings
        aggressive_table_extraction:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Aggressive Table Extraction
          description: Use aggressive heuristics to detect table boundaries, even without visible borders. Useful for documents with borderless or complex tables
        disable_heuristics:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Disable Heuristics
          description: Disable automatic heuristics including outlined table extraction and adaptive long table handling. Use when heuristics produce incorrect results
        specialized_chart_parsing:
          anyOf:
          - type: string
            enum:
            - agentic_plus
            - agentic
            - efficient
          - type: 'null'
          title: Specialized Chart Parsing
          description: 'Enable AI-powered chart analysis. Modes: ''efficient'' (fast, lower cost), ''agentic'' (balanced), ''agentic_plus'' (highest accuracy). Automatically enables extract_layout and precise_bounding_box when set'
        cost_optimizer:
          anyOf:
          - $ref: '#/components/schemas/LlamaParseCostOptimizerParameters'
          - type: 'null'
          description: Cost optimization settings. Only available with 'agentic' or 'agentic_plus' tiers
        auto_mode_configuration:
          anyOf:
          - items:
              $ref: '#/components/schemas/AutoModeConfigurationEntry'
            type: array
          - type: 'null'
          title: Auto Mode Configuration
          description: Conditional processing rules that apply different parsing options based on page content, document structure, or filename patterns. Each entry defines trigger conditions and the parsing configuration to apply when triggered
      additionalProperties: false
      type: object
      title: LlamaParseProcessingOptions
      description: 'Processing options shared across all parsing tiers.


        These options control how documents are analyzed and processed regardless of the selected tier.

        Some options automatically enable additional behaviors (e.g., specialized_chart_parsing

        enables extract_layout and precise_bounding_box).'
    LlamaParseCostOptimizerParameters:
      properties:
        enable:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Enable
          description: 'Enable cost-optimized parsing. Routes simpler pages to faster processing while complex pages use full AI analysis. May reduce speed on some documents. IMPORTANT: Only available with ''agentic'' or ''agentic_plus'' tiers'
      additionalProperties: false
      type: object
      title: LlamaParseCostOptimizerParameters
      description: 'Cost optimizer configuration for reducing parsing costs on simpler pages.


        When enabled, the parser analyzes each page and routes simpler pages to faster,

        cheaper processing while preserving quality for complex pages. Only works with

        ''agentic'' or ''agentic_plus'' tiers.'
    LlamaParseSpreadsheetOptions:
      properties:
        detect_sub_tables_in_sheets:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Detect Sub Tables In Sheets
          description: Detect and extract multiple tables within a single sheet. Useful when spreadsheets contain several data regions separated by blank rows/columns
        force_formula_computation_in_sheets:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Force Formula Computation In Sheets
          description: Compute formula results instead of extracting formula text. Use when you need calculated values rather than formula definitions
        include_hidden_sheets:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Include Hidden Sheets
          description: Parse hidden sheets in addition to visible ones. By default, hidden sheets are skipped
      additionalProperties: false
      type: object
      title: LlamaParseSpreadsheetOptions
      description: Spreadsheet (Excel, CSV, ODS) parsing options.
    AutoModeSpatialTextOptions:
      properties:
        preserve_layout_alignment_across_pages:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Preserve Layout Alignment Across Pages
          description: Preserve text alignment across page boundaries
        preserve_very_small_text:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Preserve Very Small Text
          description: Include very small text in spatial output
        do_not_unroll_columns:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Do Not Unroll Columns
          description: Keep column structure intact without unrolling
      additionalProperties: false
      type: object
      title: AutoModeSpatialTextOptions
      description: Spatial text options for auto mode parsing configuration.
    SpreadsheetV1Parameters:
      properties:
        sheet_names:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Sheet Names
          description: The names of the sheets to extract regions from. If empty, all sheets will be processed.
        include_hidden_cells:
          type: boolean
          title: Include Hidden Cells
          description: Whether to include hidden cells when extracting regions from the spreadsheet.
          default: true
        extraction_range:
          anyOf:
          - type: string
          - type: 'null'
          title: Extraction Range
          description: A1 notation of the range to extract a single region from. If None, the entire sheet is used.
        generate_additional_metadata:
          type: boolean
          title: Generate Additional Metadata
          description: Whether to generate additional metadata (title, description) for each extracted region.
          default: true
        use_experimental_processing:
          type: boolean
          title: Use Experimental Processing
          description: Enables experimental processing. Accuracy may be impacted.
          default: false
        flatten_hierarchical_tables:
          type: boolean
          title: Flatten Hierarchical Tables
          description: Return a flattened dataframe when a detected table is recognized as hierarchical.
          default: false
        table_merge_sensitivity:
          type: string
          enum:
          - strong
          - weak
          title: Table Merge Sensitivity
          description: Influences how likely similar-looking regions are merged into a single table. Useful for spreadsheets that either have sparse tables (strong merging) or many distinct tables close together (weak merging).
          default: strong
        specialization:
          anyOf:
          - type: string
          - type: 'null'
          title: Specialization
          description: 'Optional specialization mode for domain-specific extraction. Supported values: ''financial-standard'', ''financial-enhanced'', ''financial-precise''. Default None uses the general-purpose pipeline.'
        product_type:
          type: string
          const: spreadsheet_v1
          title: Product Type
          description: Product type.
      type: object
      required:
      - product_type
      title: SpreadsheetV1Parameters
      description: Typed parameters for a *spreadsheet v1* product configuration.
    LlamaParsePageRanges:
      properties:
        max_pages:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Max Pages
          description: Maximum number of pages to process. Pages are processed in order starting from page 1. If both max_pages and target_pages are set, target_pages takes precedence
        target_pages:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Pages
          description: 'Comma-separated list of specific pages to process using 1-based indexing. Supports individual pages and ranges. Examples: ''1,3,5'' (pages 1, 3, 5), ''1-5'' (pages 1 through 5 inclusive), ''1,3,5-8,10'' (pages 1, 3, 5-8, and 10). Pages are sorted and deduplicated automatically. Duplicate pages cause an error'
      additionalProperties: false
      type: object
      title: LlamaParsePageRanges
      description: Page selection options for processing specific pages or limiting page count.
    LlamaParsePdfOptions:
      properties: {}
      additionalProperties: false
      type: object
      title: LlamaParsePdfOptions
    SplitStrategy:
      properties:
        allow_uncategorized:
          type: string
          enum:
          - include
          - forbid
          - omit
          title: Allow Uncategorized
          description: 'Controls handling of pages that don''t match any category. ''include'': pages can be grouped as ''uncategorized'' and included in results. ''forbid'': all pages must be assigned to a defined category. ''omit'': pages can be classified as ''uncategorized'' but are excluded from results.'
          default: include
      type: object
      title: SplitStrategy
      description: Configuration for how to split the document.
    LlamaParseTimeouts:
      properties:
        base_in_seconds:
          anyOf:
          - type: integer
            maximum: 7200.0
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Base In Seconds
          description: Base timeout for the job in seconds (max 7200 = 2 hours). This is the minimum time allowed regardless of document size
        extra_time_per_page_in_seconds:
          anyOf:
          - type: integer
            maximum: 300.0
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Extra Time Per Page In Seconds
          description: Additional timeout per page in seconds (max 300 = 5 minutes). Total timeout = base + (this value × page count)
      additionalProperties: false
      type: object
      title: LlamaParseTimeouts
      description: 'Job timeout configuration.


        Total timeout = base_in_seconds + (extra_time_per_page_in_seconds × page_count).

        Use these settings for large documents or complex parsing that needs more time.'
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
