          - type: string
          title: Version
          description: 'Version for the selected tier. Use `latest`, or pin one of that tier''s dated versions.


            Current `latest` by tier:

            - `fast`: `2025-12-11`

            - `cost_effective`: `2026-06-05`

            - `agentic`: `2026-06-04`

            - `agentic_plus`: `2026-06-04`


