        effective_at:
          type: string
          format: date-time
          title: Effective At
        job_record_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Job Record Id
          description: The job record ID associated with this status, if any.
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
          description: Error message for the latest job attempt, if any.
        item_id:
          type: string
          title: Item Id
          description: ID of the item
        item_name:
          type: string
          title: Item Name
          description: Name of the item
        job_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Job Id
          description: Job ID for the underlying processing job (links to parse/extract job results)
        skip_reason:
