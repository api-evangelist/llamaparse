        page_contains_at_most_n_lines:
          anyOf:
          - type: integer
          - type: string
          - type: 'null'
          title: Page Contains At Most N Lines
          description: Trigger if page has fewer than N lines
        page_contains_at_least_n_images:
          anyOf:
          - type: integer
          - type: string
          - type: 'null'
          title: Page Contains At Least N Images
