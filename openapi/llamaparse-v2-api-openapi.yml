          description: Trigger if page has more than N% numeric words
        page_contains_at_most_n_percent_numbers:
          anyOf:
          - type: integer
          - type: string
          - type: 'null'
          title: Page Contains At Most N Percent Numbers
          description: Trigger if page has fewer than N% numeric words
        page_contains_at_least_n_numbers:
          anyOf:
          - type: integer
          - type: string
          - type: 'null'
          title: Page Contains At Least N Numbers
          description: Trigger if page has more than N numeric words
        page_contains_at_most_n_numbers:
          anyOf:
          - type: integer
          - type: string
          - type: 'null'
          title: Page Contains At Most N Numbers
          description: Trigger if page has fewer than N numeric words
        regexp_in_page:
