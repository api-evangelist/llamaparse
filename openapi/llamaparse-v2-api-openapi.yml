        page_contains_at_most_n_images:
          anyOf:
          - type: integer
          - type: string
          - type: 'null'
          title: Page Contains At Most N Images
          description: Trigger if page has fewer than N images
        page_contains_at_least_n_tables:
          anyOf:
          - type: integer
          - type: string
          - type: 'null'
          title: Page Contains At Least N Tables
          description: Trigger if page has more than N tables
        page_contains_at_most_n_tables:
          anyOf:
          - type: integer
          - type: string
          - type: 'null'
          title: Page Contains At Most N Tables
          description: Trigger if page has fewer than N tables
        page_contains_at_least_n_links:
          anyOf:
          - type: integer
          - type: string
          - type: 'null'
          title: Page Contains At Least N Links
          description: Trigger if page has more than N links
        page_contains_at_most_n_links:
          anyOf:
          - type: integer
          - type: string
          - type: 'null'
          title: Page Contains At Most N Links
          description: Trigger if page has fewer than N links
        page_contains_at_least_n_charts:
          anyOf:
          - type: integer
          - type: string
          - type: 'null'
          title: Page Contains At Least N Charts
          description: Trigger if page has more than N charts
        page_contains_at_most_n_charts:
          anyOf:
