components:
  schemas:
    ResultTypeMetadata:
      properties:
        size_bytes:
          type: integer
          title: Size Bytes
          description: Size of the result file in bytes
        exists:
          type: boolean
          title: Exists
          description: Whether the result file exists in S3
          default: true
        presigned_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Presigned Url
          description: Presigned URL to download the result file
      type: object
      required:
      - size_bytes
      title: ResultTypeMetadata
      description: Metadata about a specific result type stored in S3.
    ClassifyV2Rule:
      properties:
        type:
          type: string
          maxLength: 50
          minLength: 1
          title: Type
          description: Document type to assign when rule matches
          examples:
          - invoice
          - receipt
          - contract
          - report
          - proposal
        description:
          type: string
          maxLength: 500
          minLength: 10
          title: Description
          description: Natural language criteria for matching this rule
          examples:
          - contains invoice number, line items, and total amount
          - purchase receipt with transaction info and merchant details
          - legal contract with terms, conditions, and signatures
      type: object
      required:
      - type
      - description
      title: ClassifyV2Rule
      description: A rule for classifying documents.
    ClassifyV2Configuration:
      properties:
        rules:
          items:
            $ref: '#/components/schemas/ClassifyV2Rule'
          type: array
          minItems: 1
          title: Rules
          description: Classify rules to evaluate against the document (at least one required)
        mode:
          type: string
          const: FAST
          title: Mode
          description: Classify execution mode
          default: FAST
        parsing_configuration:
          anyOf:
          - $ref: '#/components/schemas/ClassifyV2ParsingConfiguration'
          - type: 'null'
          description: Parsing configuration for controlling which pages are read
      type: object
      required:
      - rules
      title: ClassifyV2Configuration
      description: Configuration for a classify job.
    ExtractJobUsage:
      properties:
        num_pages_extracted:
          anyOf:
          - type: integer
          - type: 'null'
          title: Num Pages Extracted
          description: Number of pages extracted
      type: object
      title: ExtractJobUsage
      description: Extraction usage metrics.
    LlamaParseTables:
      properties:
        compact_markdown_tables:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Compact Markdown Tables
          description: Remove extra whitespace padding in markdown table cells for more compact output
        output_tables_as_markdown:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Output Tables As Markdown
          description: Output tables as markdown pipe tables instead of HTML &lt;table&gt; tags. Markdown tables are simpler but cannot represent complex structures like merged cells
        markdown_table_multiline_separator:
          anyOf:
          - type: string
          - type: 'null'
          title: Markdown Table Multiline Separator
          description: 'Separator string for multiline cell content in markdown tables. Example: ''&lt;br&gt;'' to preserve line breaks, '' '' to join with spaces'
        merge_continued_tables:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Merge Continued Tables
          description: Automatically merge tables that span multiple pages into a single table. The merged table appears on the first page with merged_from_pages metadata
      additionalProperties: false
      type: object
      title: LlamaParseTables
      description: Table formatting options for markdown output.
    ImageMetadata:
      properties:
        index:
          type: integer
          title: Index
          description: Index of the image in the extraction order
        filename:
          type: string
          title: Filename
          description: Image filename (e.g., 'image_0.png')
        content_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Content Type
          description: MIME type of the image
        size_bytes:
          anyOf:
          - type: integer
          - type: 'null'
          title: Size Bytes
          description: 'Deprecated: always returns None. Will be removed in a future release.'
          deprecated: true
        presigned_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Presigned Url
          description: Presigned URL to download the image
        category:
          anyOf:
          - type: string
            enum:
            - screenshot
            - embedded
            - layout
          - type: 'null'
          title: Category
          description: 'Image category: ''screenshot'' (full page), ''embedded'' (images in document), or ''layout'' (cropped from layout detection)'
        bbox:
          anyOf:
          - $ref: '#/components/schemas/ImageMetadataBBox'
          - type: 'null'
          description: Bounding box of the image on its page
      type: object
      required:
      - index
      - filename
      title: ImageMetadata
      description: Metadata for a single extracted image.
    MarkdownResult:
      properties:
        pages:
          items:
            anyOf:
            - $ref: '#/components/schemas/MarkdownResultPage'
            - $ref: '#/components/schemas/FailedMarkdownPage'
          type: array
          title: Pages
          description: List of markdown pages or failed page entries
      type: object
      required:
      - pages
      title: MarkdownResult
    AutoModePresentationOptions:
      properties:
        out_of_bounds_content:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Out Of Bounds Content
          description: Extract out of bounds content in presentation slides
        skip_embedded_data:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Skip Embedded Data
          description: Skip extraction of embedded data for charts in presentation slides
      additionalProperties: false
      type: object
      title: AutoModePresentationOptions
      description: Presentation-specific options for auto mode parsing configuration.
    ParseJobQueryResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ParseJobResponse'
          type: array
          title: Items
          description: The list of items.
        next_page_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Page Token
          description: A token, which can be sent as page_token to retrieve the next page. If this field is omitted, there are no subsequent pages.
        total_size:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Size
          description: The total number of items available. This is only populated when specifically requested. The value may be an estimate and can be used for display purposes only.
      type: object
      required:
      - items
      title: ParseJobQueryResponse
      description: Response schema for paginated parse job queries.
    BatchQueryResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/BatchResponse'
          type: array
          title: Items
          description: The list of items.
        next_page_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Page Token
          description: A token, which can be sent as page_token to retrieve the next page. If this field is omitted, there are no subsequent pages.
        total_size:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Size
          description: The total number of items available. This is only populated when specifically requested. The value may be an estimate and can be used for display purposes only.
      type: object
      required:
      - items
      title: BatchQueryResponse
      description: Paginated list of batches.
    LlamaParseIgnoreOptions:
      properties:
        ignore_diagonal_text:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Ignore Diagonal Text
          description: Skip text rotated at an angle (not horizontal/vertical). Useful for ignoring watermarks or decorative angled text
        ignore_text_in_image:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Ignore Text In Image
          description: Skip OCR text extraction from embedded images. Use when images contain irrelevant text (watermarks, logos) that shouldn't be in the output
        ignore_hidden_text:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Ignore Hidden Text
          description: Skip text marked as hidden in the document structure. Some PDFs contain invisible text layers used for accessibility or search indexing
      additionalProperties: false
      type: object
      title: LlamaParseIgnoreOptions
      description: Options for ignoring specific types of text during extraction.
    ExtractV2JobCreate:
      properties:
        webhook_configurations:
          anyOf:
          - items:
              $ref: '#/components/schemas/WebhookConfiguration'
            type: array
          - type: 'null'
          title: Webhook Configurations
          description: Outbound webhook endpoints to notify on job status changes
        configuration_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Configuration Id
          description: Saved configuration ID
          examples:
          - cfg-11111111-2222-3333-4444-555555555555
        configuration:
          anyOf:
          - $ref: '#/components/schemas/ExtractConfiguration'
          - type: 'null'
          description: Inline configuration with extract options and optional parse settings
        file_input:
          type: string
          maxLength: 200
          title: File Input
          description: File ID or parse job ID to extract from
          examples:
          - dfl-aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
      type: object
      required:
      - file_input
      title: ExtractV2JobCreate
      description: Request to create an extraction job. Provide configuration_id or inline configuration.
      examples:
      - configuration_id: cfg-11111111-2222-3333-4444-555555555555
        file_input: dfl-aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
      - configuration:
          data_schema:
            properties:
              vendor_name:
                description: Name of the vendor
                type: string
              total_amount:
                description: Total amount in dollars
                type: number
            required:
            - vendor_name
            - total_amount
            type: object
          target_pages: 1,3,5-7
        file_input: dfl-aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
      - configuration:
          data_schema:
            properties:
              name:
                type: string
