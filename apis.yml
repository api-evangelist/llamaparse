- aid: llamaparse-index-api
  name: LlamaCloud Index API
  description: >
    Managed vector index API for ingesting parsed documents into searchable LlamaCloud indexes. Supports
    standard (1 credit/page), spreadsheet (2 credits/page), and multi-modal (2 credits/page) indexing
    modes with real-time status monitoring.
  humanURL: https://developers.llamaindex.ai/llamaparse/
  baseURL: https://api.cloud.llamaindex.ai
