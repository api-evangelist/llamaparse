- aid: llamaparse-extract-api
  name: LlamaParse Extract API
  description: >
    Structured data extraction API that pulls typed JSON output from unstructured documents using developer-defined
    schemas. Supports cost-effective and agentic tiers; composable with Parse to reduce per-page costs
    when re-extracting previously parsed documents.
  humanURL: https://developers.llamaindex.ai/llamaparse/
