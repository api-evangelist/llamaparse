- aid: llamaparse-classify-api
  name: LlamaParse Classify API
  description: >
    Document classification API that categorizes uploaded files by type or content. Available in fast
    (1 credit/page) and multimodal (2 credits/page) modes; useful for pre-filtering before invoking higher-cost
    parse or extract operations.
  humanURL: https://developers.llamaindex.ai/llamaparse/
  baseURL: https://api.cloud.llamaindex.ai
